name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by deploy.yml so a deploy re-runs these checks on its exact commit

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job here needs AWS credentials or any repository secret.
jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --frozen --dev --group infra --extra bayes --extra gbm --extra dashboard --extra serve
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Typecheck
        run: uv run mypy
      - name: Test
        # includes the API tests (deterministic synthetic artifact, stubbed S3)
        # and the infrastructure template assertions; "live" tests need API keys
        run: uv run pytest -m "not live"

  container:
    name: container build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build the synthetic test artifact
        run: |
          uv sync --frozen --no-dev --extra gbm --extra serve
          uv run --no-sync wc2026 export-artifact --synthetic --version ci-fixture --out "$RUNNER_TEMP/artifacts"
      - name: Build image
        run: docker build --platform linux/amd64 -t wc2026-api:ci .
      - name: Image runs as non-root
        run: test "$(docker run --rm wc2026-api:ci id -u)" != "0"
      - name: Start container
        run: |
          docker run -d --name api -p 8080:8080 \
            -v "$RUNNER_TEMP/artifacts/ci-fixture:/artifact:ro" \
            -e WC2026_ARTIFACT_SOURCE=local \
            -e WC2026_ARTIFACT_DIR=/artifact \
            -e WC2026_ARTIFACT_VERSION=ci-fixture \
            wc2026-api:ci
      - name: Smoke checks (ready, predict, invalid input, comparison)
        run: python3 tools/smoke.py http://127.0.0.1:8080 --expect-version ci-fixture --wait 60
      - name: Container without an artifact is alive but not ready
        run: |
          docker run -d --name empty -p 8081:8080 wc2026-api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8081/health && break || sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/health)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ready)" = "503"
      - name: Graceful stop
        run: |
          docker stop --time 30 api
          test "$(docker inspect -f '{{.State.ExitCode}}' api)" = "0"
      - name: Container logs
        if: always()
        run: |
          docker logs api || true
          docker logs empty || true

  infra:
    name: infrastructure synth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synthesize the CloudFormation template (no AWS access)
        working-directory: infra
        run: |
          uv sync --frozen --no-dev --group infra
          uv run --no-sync npx --yes aws-cdk@2.1144.0 synth --quiet -c artifact_version=ci
