[project]
name = "wc2026"
version = "0.1.0"
description = "Calibrated probabilistic forecasting engine for the 2026 FIFA World Cup, benchmarked against the betting market"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=16,<22",
    "scipy>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "typer>=0.12,<1",
    "requests>=2.32,<3",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
bayes = ["pymc>=5.15,<6", "arviz>=0.18,<1"]
gbm = ["lightgbm>=4.3,<5", "scikit-learn>=1.4,<2"]
dashboard = ["fastapi>=0.111,<1", "uvicorn>=0.29,<1", "plotly>=5.20,<7"]

[project.scripts]
wc2026 = "wc2026.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "hypothesis>=6.100,<7",
    "ruff>=0.4",
    "mypy>=1.10,<2",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wc2026"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "D"]
ignore = [
    "D105", # missing docstring in magic method
    "D107", # missing docstring in __init__ (documented at class level)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["wc2026"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "pyarrow.*", "uvicorn.*", "fastapi.*", "lightgbm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pymc/pytensor/arviz ship py.typed but are effectively untyped at the call
# sites we use; skip following them so their returns are treated as Any.
module = ["pymc.*", "pytensor.*", "arviz.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
# FastAPI's route decorators are untyped; that's the framework, not our code
module = ["wc2026.dashboard.app"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: tests that hit real external APIs (require keys; excluded in CI)",
]
